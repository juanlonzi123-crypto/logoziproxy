<!doctype html>
<html lang="es" data-theme="gx">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08080c">
  <title>Shadow GX</title>
  <style>
    /* ───────── Temas ───────── */
    :root, [data-theme="gx"] {
      --bg: #08080c; --tabstrip-bg: #08080c; --toolbar-bg: #12121a; --omni-bg: #1b1b26;
      --sidebar-bg: #0c0c12; --surface: #161620; --border: #262634;
      --text: #f4f4f8; --muted: #8a8a9d; --tab-hover: #14141c;
      --accent: #fa1e4e; --accent-2: #8a3cff; --glow: 0 0 18px rgba(250, 30, 78, .45);
      --home-bg: #07070b; --tab-r: 10px;
    }
    [data-theme="chrome"] {
      --bg: #202124; --tabstrip-bg: #202124; --toolbar-bg: #35363a; --omni-bg: #202124;
      --sidebar-bg: #202124; --surface: #2d2e31; --border: #4a4c50;
      --text: #e8eaed; --muted: #9aa0a6; --tab-hover: #2b2c2f;
      --accent: #8ab4f8; --accent-2: #8ab4f8; --glow: none;
      --home-bg: #202124; --tab-r: 10px;
    }
    [data-theme="light"] {
      --bg: #dee1e6; --tabstrip-bg: #dee1e6; --toolbar-bg: #ffffff; --omni-bg: #f1f3f4;
      --sidebar-bg: #dee1e6; --surface: #ffffff; --border: #dadce0;
      --text: #202124; --muted: #5f6368; --tab-hover: #e8eaed;
      --accent: #1a73e8; --accent-2: #1a73e8; --glow: none;
      --home-bg: #ffffff; --tab-r: 10px;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text);
      font: 14px/1.3 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; overflow: hidden; }
    button { font: inherit; color: inherit; }
    .ico { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2;
      stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }

    #app { display: flex; height: 100%; }
    #main { position: relative; flex: 1; min-width: 0; display: flex; flex-direction: column; }

    /* ───────── Barra lateral (Opera GX) ───────── */
    #sidebar { display: none; width: 58px; flex-direction: column; align-items: center; gap: 8px;
      padding: 12px 0; background: var(--sidebar-bg); border-right: 1px solid var(--border); }
    [data-theme="gx"] #sidebar { display: flex; }
    #sb-sites { display: flex; flex-direction: column; gap: 8px; }
    .sb-btn { width: 40px; height: 40px; border: 0; border-radius: 12px; background: transparent;
      color: var(--muted); cursor: pointer; display: grid; place-items: center; transition: .15s; }
    .sb-btn:hover { background: var(--surface); color: var(--text); box-shadow: var(--glow); }
    .sb-btn.logo { color: var(--accent); filter: drop-shadow(0 0 8px var(--accent)); }
    .sb-ico { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center;
      color: #fff; font-size: 13px; font-weight: 700; }
    .sb-sep { width: 26px; height: 1px; background: var(--border); margin: 4px 0; }
    .sb-spacer { flex: 1; }

    /* ───────── Pestañas ───────── */
    #tabstrip { display: flex; align-items: flex-end; gap: 2px; padding: 8px 8px 0; background: var(--tabstrip-bg); }
    #tabs { display: flex; gap: 2px; min-width: 0; overflow-x: auto; scrollbar-width: none; }
    .tab { position: relative; display: flex; align-items: center; gap: 8px; flex: 0 1 220px; width: 220px;
      min-width: 64px; height: 36px; padding: 0 8px 0 12px; border-radius: var(--tab-r) var(--tab-r) 0 0;
      color: var(--muted); cursor: pointer; user-select: none; transition: background .15s, color .15s; }
    .tab:hover { background: var(--tab-hover); color: var(--text); }
    .tab.active { background: var(--toolbar-bg); color: var(--text); }
    [data-theme="gx"] .tab.active { box-shadow: inset 0 -2px 0 var(--accent), 0 8px 18px -10px var(--accent); }
    .tab .title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
    .fav { flex: none; width: 16px; height: 16px; border-radius: 50%; display: grid; place-items: center;
      font-size: 9px; font-weight: 700; color: #fff; }
    .fav.home { background: linear-gradient(135deg, var(--accent), var(--accent-2)); }
    .tab.loading .fav { background: transparent !important; color: transparent; border: 2px solid var(--accent);
      border-right-color: transparent; animation: spin .8s linear infinite; }
    .tab .close { flex: none; display: grid; place-items: center; width: 20px; height: 20px; border: 0;
      border-radius: 50%; background: transparent; font-size: 15px; line-height: 1; cursor: pointer; opacity: .7; }
    .tab .close:hover { background: rgba(127, 127, 127, .25); opacity: 1; }
    #new-tab { flex: none; display: grid; place-items: center; width: 30px; height: 30px; margin: 0 0 3px 4px;
      border: 0; border-radius: 50%; background: transparent; color: var(--muted); cursor: pointer; }
    #new-tab:hover { background: var(--surface); color: var(--text); }

    /* ───────── Barra de herramientas ───────── */
    #toolbar { display: flex; align-items: center; gap: 4px; padding: 6px 10px; background: var(--toolbar-bg); }
    .tb-btn { flex: none; display: grid; place-items: center; width: 34px; height: 34px; border: 0;
      border-radius: 50%; background: transparent; color: var(--muted); cursor: pointer; transition: .15s; }
    .tb-btn:hover:not(:disabled) { background: rgba(127, 127, 127, .2); color: var(--text); }
    .tb-btn:disabled { opacity: .35; cursor: default; }
    #omnibox { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 6px 0 14px;
      border-radius: 19px; background: var(--omni-bg); border: 1px solid transparent; transition: .18s; }
    #omnibox:focus-within { border-color: var(--accent); box-shadow: var(--glow); }
    #secure { flex: none; display: grid; place-items: center; color: var(--muted); }
    #secure[data-state="ok"] { color: #3ddc84; }
    #secure[data-state="warn"] { color: #ffb020; }
    #url { flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: transparent; color: var(--text); font: inherit; font-size: 14px; }
    #star { width: 30px; height: 30px; }
    #star.on { color: var(--accent); }
    #star.on .ico { fill: var(--accent); }

    #progress { position: relative; height: 2px; overflow: hidden; background: var(--toolbar-bg); }
    #progress.active::after { content: ''; position: absolute; top: 0; bottom: 0; width: 35%;
      background: linear-gradient(90deg, transparent, var(--accent), var(--accent-2)); animation: slide 1s ease-in-out infinite; }

    #bookmarks { display: flex; gap: 4px; padding: 4px 10px 6px; background: var(--toolbar-bg);
      border-bottom: 1px solid var(--border); overflow-x: auto; scrollbar-width: none; }
    #bookmarks[hidden] { display: none; }
    .bm { flex: none; display: flex; align-items: center; gap: 6px; max-width: 160px; height: 26px; padding: 0 10px 0 6px;
      border: 0; border-radius: 13px; background: transparent; color: var(--text); font-size: 12px; cursor: pointer; }
    .bm:hover { background: rgba(127, 127, 127, .2); }
    .bm-ico { flex: none; width: 16px; height: 16px; border-radius: 50%; display: grid; place-items: center;
      font-size: 9px; font-weight: 700; color: #fff; }
    .bm-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* ───────── Menú ───────── */
    #menu { position: absolute; z-index: 50; top: 100px; right: 12px; width: 250px; padding: 8px;
      border-radius: 14px; background: var(--surface); border: 1px solid var(--border);
      box-shadow: 0 16px 40px rgba(0, 0, 0, .45), var(--glow); }
    #menu[hidden] { display: none; }
    #menu h4 { margin: 8px 10px 4px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
    .mi { display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 10px; border: 0; border-radius: 8px;
      background: transparent; cursor: pointer; text-align: left; }
    .mi:hover { background: rgba(127, 127, 127, .18); }
    .mi .dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--muted); }
    .mi.on .dot { border-color: var(--accent); background: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
    .mi .sw { width: 14px; height: 14px; border-radius: 4px; }
    .msep { height: 1px; margin: 6px 4px; background: var(--border); }

    /* ───────── Viewport y estado ───────── */
    #viewport { position: relative; flex: 1; background: var(--bg); overflow: hidden; }
    .tab-view { position: absolute; inset: 0; }
    .tab-view[hidden] { display: none !important; }
    #status { position: absolute; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 16px; padding: 24px; background: var(--bg); text-align: center; }
    #status[hidden] { display: none; }
    #status .spinner { width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--border);
      border-top-color: var(--accent); animation: spin .8s linear infinite; }
    #status.error .spinner { display: none; }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(300%); } }
  </style>
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <button id="sb-logo" class="sb-btn logo" title="Nueva pestaña" aria-label="Nueva pestaña">
        <svg viewBox="0 0 24 24" width="24" height="24"><path d="M12 2l8 10-8 10-8-10z" fill="currentColor"/></svg>
      </button>
      <div class="sb-sep"></div>
      <div id="sb-sites"></div>
      <div class="sb-spacer"></div>
      <button id="sb-menu" class="sb-btn" title="Ajustes" aria-label="Ajustes">
        <svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </aside>

    <div id="main">
      <div id="tabstrip">
        <div id="tabs"></div>
        <button id="new-tab" title="Nueva pestaña" aria-label="Nueva pestaña">
          <svg class="ico" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>

      <div id="toolbar">
        <button id="back" class="tb-btn" title="Atrás" aria-label="Atrás" disabled>
          <svg class="ico" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <button id="forward" class="tb-btn" title="Adelante" aria-label="Adelante" disabled>
          <svg class="ico" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
        </button>
        <button id="reload" class="tb-btn" title="Recargar" aria-label="Recargar">
          <svg class="ico" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg>
        </button>
        <div id="omnibox">
          <span id="secure" data-state="none">
            <svg class="ico" viewBox="0 0 24 24" width="16" height="16"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
          </span>
          <input id="url" type="text" placeholder="Busca o escribe una URL" autocomplete="off" spellcheck="false">
          <button id="star" class="tb-btn" title="Añadir a marcadores" aria-label="Marcador" disabled>
            <svg class="ico" viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>
          </button>
        </div>
        <button id="menu-btn" class="tb-btn" title="Menú" aria-label="Menú">
          <svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="12" cy="19" r="1.2"/></svg>
        </button>
      </div>
      <div id="progress"></div>
      <div id="bookmarks" hidden></div>

      <div id="viewport">
        <div id="status"><div class="spinner"></div><p class="msg">Iniciando proxy…</p></div>
      </div>

      <div id="menu" hidden>
        <h4>Aspecto</h4>
        <button class="mi" data-theme-pick="gx"><span class="sw" style="background:linear-gradient(135deg,#fa1e4e,#8a3cff)"></span>Opera GX</button>
        <button class="mi" data-theme-pick="chrome"><span class="sw" style="background:#8ab4f8"></span>Chrome oscuro</button>
        <button class="mi" data-theme-pick="light"><span class="sw" style="background:#dee1e6;border:1px solid #aaa"></span>Chrome claro</button>
        <div class="msep"></div>
        <button class="mi" id="menu-new"><span class="dot" style="visibility:hidden"></span>Nueva pestaña</button>
        <button class="mi" id="toggle-bar"><span class="dot"></span>Barra de marcadores</button>
      </div>
    </div>
  </div>

  <script src="/uv/uv.bundle.js"></script>
  <script src="/uv/uv.config.js"></script>
  <script src="/baremux/index.js"></script>
  <script type="module" src="/index.js"></script>
</body>
</html>
